server {
    listen 127.0.0.1:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 504 = @gateway_timeout;

    location ~ ^/api/profiles/[^/]+/run/stream$ {
        proxy_pass http://127.0.0.1:5111;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5111/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5111/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }

    location @gateway_timeout {
        internal;
        default_type application/problem+json;
        return 504 '{"title":"Gateway timeout","status":504,"detail":"The backend did not respond before the proxy timeout."}';
    }
}
