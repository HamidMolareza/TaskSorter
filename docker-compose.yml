services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tasksorter
      POSTGRES_USER: tasksorter
      POSTGRES_PASSWORD: tasksorter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksorter -d tasksorter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: src/TaskSorter.Backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=tasksorter;Username=tasksorter;Password=tasksorter
      DataProtection__KeysPath: /var/lib/tasksorter/keys
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5111:8080"
    volumes:
      - data-protection-keys:/var/lib/tasksorter/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: src/TaskSorter.Frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  data-protection-keys:
